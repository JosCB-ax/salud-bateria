# Uso único: mueve las etiquetas de versión a los cambios reescritos (sin el correo antiguo).
name: Mover etiquetas

on:
  push:
    branches: [main]
    paths: [.github/workflows/etiquetas.yml]

permissions:
  contents: write

jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apuntar cada etiqueta al cambio equivalente de main
        run: |
          git fetch --tags --force
          for t in $(git tag); do
            clave=$(git log -1 --format='%at %s' "$t")
            nuevo=$(git log main --format='%H %at %s' | grep -F " $clave" | head -1 | cut -d' ' -f1)
            if [ -n "$nuevo" ] && [ "$nuevo" != "$(git rev-parse "$t^{}")" ]; then
              git tag -f "$t" "$nuevo" && git push --force origin "refs/tags/$t"
              echo "$t -> $nuevo"
            fi
          done
