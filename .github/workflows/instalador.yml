# Construye los instaladores (Windows, macOS y Linux) en cada cambio y los publica en "Releases".
name: Instaladores

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install pyinstaller -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: Leer la versión
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path instalador.iss -Pattern '#define Version "(.+)"').Matches[0].Groups[1].Value
          "numero=$v" >> $env:GITHUB_OUTPUT

      - name: Crear SaludBateria.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --name SaludBateria
          --icon icono.ico --add-data "icono.ico;." --version-file version.txt
          --hidden-import pystray._win32 app.py

      - name: Crear el instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp instalador.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: instalador/*.exe

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-latest       # chip Apple
            chip: Apple
          - runner: macos-15-intel     # procesador Intel
            chip: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install pyinstaller -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Crear SaludBateria.app y el .dmg
        run: |
          v=$(sed -n 's/#define Version "\(.*\)"/\1/p' instalador.iss)
          python -m PyInstaller --noconfirm --clean --windowed --name SaludBateria \
            --icon icono.ico --add-data "icono.ico:." --hidden-import pystray._darwin \
            --osx-bundle-identifier com.saludbateria.app app.py
          mkdir dmg && cp -R dist/SaludBateria.app LICENCIA.txt dmg/ && ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Salud de la bateria" -srcfolder dmg -format UDZO \
            "SaludBateria-$v-macOS-${{ matrix.chip }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.chip }}
          path: "*.dmg"

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install pyinstaller -r requirements.txt
      - name: Pruebas
        run: python -m unittest discover -s tests
      - name: Crear el ejecutable y el paquete
        run: |
          v=$(sed -n 's/#define Version "\(.*\)"/\1/p' instalador.iss)
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SaludBateria \
            --add-data "icono.ico:." --hidden-import pystray._xorg --exclude-module gi app.py
          d="SaludBateria-$v-Linux"
          mkdir "$d"
          cp dist/SaludBateria LICENCIA.txt empaquetado/instalar-linux.sh empaquetado/desinstalar-linux.sh "$d/"
          python -c "from PIL import Image; Image.open('icono.ico').save('$d/icono.png')"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  publicar:
    needs: [construir, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "numero=$(sed -n 's/#define Version "\(.*\)"/\1/p' instalador.iss)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manual en PDF
        run: |
          python -m pip install reportlab
          python manual.py paquetes "${{ steps.version.outputs.numero }}"
      - name: Huellas SHA-256 (el programa las comprueba antes de instalar una actualización)
        run: cd paquetes && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.numero }}
          name: Salud de la batería ${{ steps.version.outputs.numero }}
          files: paquetes/*
          make_latest: true
